spring.application.name=ProjectComputer

# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/computer_db
spring.datasource.username=postgres
spring.datasource.password=Nha1213

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=8082

# JWT (override app.jwt.secret with an environment-specific random value)
app.jwt.secret=change-this-development-secret-key-to-a-long-random-value-123456
app.jwt.access-expiration-ms=600000
app.jwt.refresh-expiration-ms=604800000
